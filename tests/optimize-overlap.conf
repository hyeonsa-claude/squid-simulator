# --optimize test: different ACLs whose values include or overlap each other.
# Rule numbers in tests/expected-optimize-overlap.txt refer to the http_access lines below.

http_port 3128
pid_filename none
access_log none
cache_log /tmp/squid-sim-test-cache.log
coredump_dir /tmp

acl localnet src 10.0.0.0/8
acl office src 10.1.0.0/16                  # inside localnet
acl office_a src 10.1.10.0/24               # inside office and localnet
acl lab src 10.1.200.0/24 192.168.50.0/24   # overlaps office (10.1.200.0/24) and localnet
acl news dstdomain .news.example
acl www_news dstdomain www.news.example     # inside news
acl sports dstdomain sports.news.example .sports.example   # overlaps news (sports.news.example)
acl web_ports port 80 443 8080
acl odd_port port 9000                      # nothing in common with web_ports
acl ports_a port 80 443
acl ports_b port 443 80                     # identical to ports_a, written in another order

http_access deny news                       # 1
http_access allow www_news                  # 2  unreachable: www_news is inside news
http_access deny !web_ports                 # 3
http_access allow odd_port                  # 4  unreachable: port 9000 always matches !web_ports
http_access deny lab                        # 5
http_access allow office                    # 6  partly shadowed by #5 (10.1.200.0/24)
http_access allow localnet                  # 7
http_access allow office_a                  # 8  redundant: office_a is inside office (#6)
http_access deny !office                    # 9
http_access deny !localnet                  # 10 redundant: outside localnet is outside office (#9)
http_access deny sports ports_a ports_b     # 11
http_access deny all                        # 12
