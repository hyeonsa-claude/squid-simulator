# squid 7.x specific optimizer checks (range merging and address normalization)

http_port 3128
pid_filename none
access_log none
cache_log /tmp/squid-sim-test-cache.log
coredump_dir /tmp

acl anyone src 0.0.0.0/0                    # matches every client address
acl office src 10.0.0.0/24
acl office src 10.0.0.128/24                # same network as 10.0.0.0/24 after masking
acl range src 10.1.0.0-10.1.0.100
acl range src 10.1.0.50-10.1.0.200          # overlaps; squid 7 merges the two ranges
acl partners src 192.168.1.0/24

http_access allow anyone                    # 1
http_access allow partners                  # 2  redundant (#1 matches every client)
http_access deny office range               # 3  unreachable (#1 allows first)
