# Test configuration for the http_access simulator (current config).
# Rule numbers in tests/expected-simulate.txt refer to the http_access lines below.

http_port 3128
pid_filename none
access_log none
cache_log /tmp/squid-sim-test-cache.log
coredump_dir /tmp

acl localnet src 10.0.0.0/8
acl localnet src 10.1.0.0/16                # optimize: covered by 10.0.0.0/8
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
acl blocked dstdomain .ads.example.com
acl blocked dstdomain www.ads.example.com   # optimize: covered by .ads.example.com
acl social dstdomain .facebook.com
acl office_hours time MTWHF 09:00-18:00
acl ua browser -i curl                      # needs a header the log does not have
acl dup1 dstdomain .dup.example
acl dup2 dstdomain .dup.example             # optimize: identical to dup1
acl unused_acl dstdomain .unused.example    # optimize: unused
acl localhost src 127.0.0.1/32              # optimize: redefines a built-in ACL

http_access deny !Safe_ports                # 1
http_access deny CONNECT !SSL_ports         # 2
http_access deny blocked                    # 3
http_access deny social office_hours        # 4
http_access allow localnet                  # 5
http_access deny ua                         # 6
http_access allow localnet Safe_ports       # 7  optimize: redundant (covered by #5)
http_access deny dup1                       # 8
http_access deny dup2                       # 9
http_access deny all                        # 10
http_access allow localnet                  # 11 optimize: redundant (#5 decides these first)
http_access allow blocked localnet          # 12 optimize: unreachable (#3 denies blocked first)
