# Test configuration for --sim-compare (the "new" config).
# Differences from squid.conf:
#  - social sites are denied at all times (not only during office hours)
#  - partners (192.168.1.0/24) are allowed

http_port 3128
pid_filename none
access_log none
cache_log /tmp/squid-sim-test-cache.log
coredump_dir /tmp

acl localnet src 10.0.0.0/8
acl partners src 192.168.1.0/24
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
acl blocked dstdomain .ads.example.com
acl social dstdomain .facebook.com

http_access deny !Safe_ports                # 1
http_access deny CONNECT !SSL_ports         # 2
http_access deny blocked                    # 3
http_access deny social                     # 4
http_access allow localnet                  # 5
http_access allow partners                  # 6
http_access deny all                        # 7
