# squid-sim.conf for tests/access-custom.log: a site-specific format with UTC times (%tg),
# the URL before the method's closing quote, and fields the simulator does not use.
squid_conf      squid.conf
access_log      access-custom.log
logformat site  %>a %la [%tg] %Ss/%03>Hs %<st "%rm %ru" %tr "%{User-Agent}>h" %un
log_format      site
log_timezone    +0900
