# squid-sim.conf: settings for scripts/squid-sim (squid itself never reads this file)
#
# squid-sim uses the first of: --sim-conf FILE, $SQUID_SIM_CONF, /etc/squid/squid-sim.conf,
# and this file. One directive per line; "auto" means squid-sim works the value out as
# described. Options on the command line always win over this file. Relative paths are
# relative to the directory of this file.

# squid.conf whose http_access rules are simulated (when -f is not given)
squid_conf      /etc/squid/squid.conf

# Log replayed when --simulate is not given. auto = the first file access_log of squid_conf
access_log      auto

# Format of that log.
#   auto = try the format squid_conf's access_log writes, then the logformats below, then the
#          ones defined in squid_conf, then squid's predefined ones (squid, common, combined,
#          referrer) and simulformat; the one matching most of the first 50 lines wins.
#   NAME = a logformat defined below or in squid_conf, or a predefined one.
log_format      auto

# Your own formats, in squid's logformat syntax (copy the line from squid.conf). The simulator
# needs %>a and %ru and also uses %tl/%tg/%ts, %la, %rm, %rv, %>Hs, %<st, %Ss and %Sh when the
# format has them; other codes are matched and ignored. Comments must be on their own line here.
#logformat mylog %>a %la [%tl] "%rm %ru HTTP/%rv" %>Hs %<st %Ss:%Sh "%{User-Agent}>h"
#log_format mylog

# Proxy address for localip/myip ACLs when the format has no %la.
# auto = the address of the first http_port, if it names one
local_ip        auto

# UTC offset for formats that log UTC times (%ts, %tg), used by time ACLs:
# local (this machine's zone, daylight saving included) or an offset such as +0900
log_timezone    local

# Defaults for squid's --sim-port and --sim-dns (auto = squid's own defaults)
sim_port        auto
sim_dns         auto

# Cache manager (squid-sim -m): squid address, and the environment variable that holds
# the cachemgr_passwd password (auto = first http_port of squid_conf, no password)
manager_url     auto
#manager_password_env SQUID_MGR_PASSWORD
